name: Continuous integration
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUILD_CONFIGURATION: Release
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run catalogue and planning tests
        run: python -m unittest -v
      - name: Build production catalogue
        run: python build.py
      - name: Publish production artifact
        uses: actions/upload-artifact@v7
        with:
          name: studyflow-dist-${{ github.sha }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
