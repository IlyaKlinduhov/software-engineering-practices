name: Build and deploy StudyFlow
on:
  push:
    branches: [main]
    paths: ['*.py', 'template.html', 'materials.json', 'backlog.json', '.github/workflows/delivery.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test before publication
        run: python -m unittest -v
      - name: Build static application
        run: python build.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Transfer build artifact to deployment
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the tested artifact
        id: deployment
        uses: actions/deploy-pages@v4
